<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Financial Advisor</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        .dashboard { 
            background-color: #1e293b; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 500px; 
        }
        h2 { 
            text-align: center; 
            margin-top: 0; 
            color: #10b981;
        }
        .input-group { 
            margin-bottom: 20px; 
        }
        .file-upload {
            padding: 15px; 
            background: #334155; 
            width: 100%; 
            box-sizing: border-box;
            border: 2px dashed #10b981; 
            color: #10b981; 
            font-weight: bold; 
            cursor: pointer;
            border-radius: 8px;
            text-align: center;
        }
        button { 
            background-color: #3b82f6; 
            color: white; 
            border: none; 
            padding: 15px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            transition: all 0.3s;
        }
        button:hover { 
            background-color: #2563eb; 
            transform: translateY(-2px);
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            transform: none;
        }
        .results { 
            display: none; 
            margin-top: 25px; 
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
        .data-box { 
            background-color: #334155; 
            padding: 15px; 
            border-radius: 8px; 
            font-family: monospace; 
            white-space: pre-wrap; 
            font-size: 14px;
            color: #cbd5e1;
        }
        .ai-box { 
            background-color: rgba(16, 185, 129, 0.1); 
            border: 1px solid #10b981;
            color: #10b981; 
            padding: 15px; 
            border-radius: 8px; 
            font-weight: 500; 
            margin-top: 15px; 
            line-height: 1.5;
        }
        h3 {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2>AI Financial Advisor 🧠</h2>
        
        <div class="input-group">
            <input type="file" id="csvUpload" accept=".csv" class="file-upload">
        </div>
        
        <button id="analyzeBtn" onclick="analyzeData()">Analyze CSV Finances</button>

        <div id="resultsArea" class="results">
            <h3>The Data Summary:</h3>
            <div id="dataSummary" class="data-box"></div>
            
            <h3>The AI Verdict:</h3>
            <div id="aiAdvice" class="ai-box"></div>
        </div>
    </div>

    <script>
        async function analyzeData() {
            const fileInput = document.getElementById('csvUpload');
            
            if (fileInput.files.length === 0) {
                alert("Please select a CSV bank statement first!");
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            btn.innerText = "Analyzing CSV... Please wait...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData // Notice we don't need 'application/json' headers for files!
                });
                
                const data = await response.json();

                if (data.status === "error") {
                    alert("Error: " + data.message);
                } else {
                    document.getElementById('dataSummary').innerText = data.data_summary;
                    document.getElementById('aiAdvice').innerText = data.ai_advice;
                    document.getElementById('resultsArea').style.display = 'block'; // Make results visible
                }
                
            } catch (error) {
                alert("Error connecting to the AI Brain! Is your Python server running?");
                console.error(error);
            }

            btn.innerText = "Analyze CSV Finances";
            btn.disabled = false;
        }
    </script>
</body>
</html>
